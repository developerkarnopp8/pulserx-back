services:
  db:
    image: postgres:16-alpine
    container_name: aevonfit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env — sem valor padrão por segurança}
      POSTGRES_DB: aevonfit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5438:5432'

  api:
    build: .
    container_name: aevonfit-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:5432/aevonfit
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env — sem valor padrão por segurança}
      JWT_EXPIRES_IN: 7d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY no .env}
      # Integrações que a API exige na subida (sem elas o container não inicia). O `:?` faz o compose parar ANTES
      # de trocar o container se faltar alguma — a versão no ar continua atendendo.
      ASAAS_API_KEY: ${ASAAS_API_KEY:?defina ASAAS_API_KEY no .env}
      ASAAS_ENV: ${ASAAS_ENV:?defina ASAAS_ENV no .env (production = cobrança real; sandbox = teste)}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?defina ASAAS_WEBHOOK_TOKEN no .env (o mesmo cadastrado no webhook do Asaas)}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?defina CLOUDINARY_CLOUD_NAME no .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?defina CLOUDINARY_API_KEY no .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?defina CLOUDINARY_API_SECRET no .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?defina RESEND_API_KEY no .env}
      EMAIL_FROM: ${EMAIL_FROM:?defina EMAIL_FROM no .env}
      PORT: 3000
      # Endereço público do site, para os links enviados por e-mail (nunca vem do cabeçalho da requisição).
      APP_URL: https://pulserx.com.br
    ports:
      - '127.0.0.1:4120:3000'

volumes:
  postgres_data:
