version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencias"
    # Majors do TypeScript e do Prisma exigem migração dedicada (Prisma 5→7 mexe em
    # schema/client; TS major mexe em @nestjs/swagger e @nestjs/schematics) — PR isolado
    # falha no CI e vira ruído. Ignorados até existir a migração; minor/patch seguem.
    # (O NestJS 10→12 já foi feito — o ignore de @nestjs/* saiu.)
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Os tipos acompanham o Node do runtime (24) — não pular pra 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # UM PR só pra todas as atualizações (minor, patch e major) — todos mexem no
    # package-lock.json, então PRs separados ficam em conflito entre si assim que o
    # primeiro é mergeado.
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
      - "ci-cd"
