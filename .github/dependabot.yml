version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
    # Majors do TypeScript e do Prisma exigem migração dedicada (Prisma 5→7 mexe em
    # schema/client; TS major mexe em @nestjs/swagger e @nestjs/schematics) — PR isolado
    # falha no CI e vira ruído. Ignorados até existir a migração; minor/patch seguem.
    # (O NestJS 10→12 já foi feito — o ignore de @nestjs/* saiu.)
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Um PR só pra todos os minor/patch — todos mexem no package-lock.json, então PRs
    # separados ficam em conflito entre si assim que o primeiro é mergeado.
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
      - "ci-cd"
