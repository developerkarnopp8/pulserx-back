version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencias"
    # Majors do TypeScript e do Prisma exigem migração dedicada (Prisma 5→7 mexe em
    # schema/client; TS major mexe em @nestjs/swagger e @nestjs/schematics) — PR isolado
    # falha no CI e vira ruído. Ignorados até existir a migração; minor/patch seguem.
    # (O NestJS 10→12 já foi feito — o ignore de @nestjs/* saiu.)
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Os tipos acompanham o Node do runtime (24) — não pular pra 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @nestjs/schematics 12 exige TypeScript >= 6 (npm ci falha com ERESOLVE) — sobe junto com o TS.
      - dependency-name: "@nestjs/schematics"
        update-types: ["version-update:semver-major"]
      # ESLint 10 / typescript-eslint 8 exigem migrar o .eslintrc.js para flat config — migração dedicada.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-prettier"
        update-types: ["version-update:semver-major"]
    # Um PR só pra todos os minor/patch — todos mexem no package-lock.json, então PRs
    # separados ficam em conflito entre si assim que o primeiro é mergeado. Majors NÃO
    # entram no grupo: um major quebrado (peer dependency, config) derrubaria o PR inteiro
    # (foi o que aconteceu no #68); cada major vem isolado, quando o Dependabot achar.
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
      - "ci-cd"
