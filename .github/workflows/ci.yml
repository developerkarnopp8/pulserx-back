name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  lint-test-build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    env:
      # prisma generate só precisa da env var presente (schema.prisma lê via env()),
      # não conecta de verdade — os testes usam PrismaService mockado, sem banco real.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/pulserx"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build

  seguranca-dependencias:
    name: Segurança — dependências (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # Produção está com 0 vulnerabilidades desde o upgrade do NestJS 10→12 (as 4 Altas de
      # multer/qs/js-yaml/lodash fecharam). As que sobram são só de devDependencies
      # (ferramentas de build/lint), fora do --omit=dev.
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    name: Segurança — CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
